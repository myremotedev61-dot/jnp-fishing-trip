# =====================================================================
# NGINX SERVER BLOCK CONFIGURATION - FISHING TRIP (PRODUCTION)
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name fishingtrip.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fishingtrip.yourdomain.com;

    root /var/www/fishing_trip/public;
    index index.php index.html;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/fishingtrip.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fishingtrip.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Client Upload Limit (misal bukti transfer hingga 10MB)
    client_max_body_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Lokasi Routing CodeIgniter 4
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM Processor
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Blokir akses ke berkas sensitif / git / env
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    # Blokir akses langsung ke writable
    location ^~ /writable/ {
        deny all;
        return 404;
    }

    # Cache untuk aset statis gambar, css, js
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    access_log /var/log/nginx/fishingtrip_access.log;
    error_log /var/log/nginx/fishingtrip_error.log;
}
