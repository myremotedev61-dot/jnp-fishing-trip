# =====================================================================
# APACHE VIRTUAL HOST CONFIGURATION - FISHING TRIP (PRODUCTION)
# =====================================================================

<VirtualHost *:80>
    ServerName fishingtrip.yourdomain.com
    ServerAdmin webmaster@yourdomain.com
    DocumentRoot "/var/www/fishing_trip/public"

    # Otomatis alihkan seluruh HTTP ke HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/fishingtrip_error.log
    CustomLog ${APACHE_LOG_DIR}/fishingtrip_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName fishingtrip.yourdomain.com
    ServerAdmin webmaster@yourdomain.com
    DocumentRoot "/var/www/fishing_trip/public"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/fishingtrip.yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/fishingtrip.yourdomain.com/privkey.pem

    <Directory "/var/www/fishing_trip/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Proteksi eksekusi skrip di folder upload publik jika ada
        <FilesMatch "(?i)\.(php|phtml|phar)$">
            Deny from all
        </FilesMatch>
    </Directory>

    # Direktori privat writable dilindungi sepenuhnya di luar web root
    # Bukti pembayaran disimpan pada /var/www/fishing_trip/writable/uploads/

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

    ErrorLog ${APACHE_LOG_DIR}/fishingtrip_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/fishingtrip_ssl_access.log combined
</VirtualHost>
